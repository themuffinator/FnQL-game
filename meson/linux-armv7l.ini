# Cross build for Linux armv7l from an x86_64 Linux host (Debian/Ubuntu
# crossbuild packages: gcc-arm-linux-gnueabihf, g++-arm-linux-gnueabihf).
# Tests run through qemu-user (package qemu-user). A native armv7l host
# can drop the cross file entirely.
[binaries]
c = 'arm-linux-gnueabihf-gcc'
ar = 'arm-linux-gnueabihf-gcc-ar'
strip = 'arm-linux-gnueabihf-strip'
exe_wrapper = ['qemu-arm', '-L', '/usr/arm-linux-gnueabihf']

[properties]
# The same command for the gate scripts, which run the engine and the probes
# they compile through it (meson.build test_env, scripts/headless.py).
fnql_exe_wrapper = ['qemu-arm', '-L', '/usr/arm-linux-gnueabihf']

[host_machine]
system = 'linux'
subsystem = 'linux'
cpu_family = 'arm'
cpu = 'armv7l'
endian = 'little'
