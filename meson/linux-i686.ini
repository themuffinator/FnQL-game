# Meson cross file for 32-bit x86 Linux modules on an x86_64 host.
#
# -m32 sits in the compiler entries, not in c_args: the engine-abi-parity and
# wire-contract gates receive the compiler as cc.cmd_array(), which holds only
# the [binaries] entry, so with -m32 in c_args their probes would compile
# 64-bit and fail.  Needs gcc-multilib (Debian/Ubuntu) or the equivalent.

[binaries]
c = ['gcc', '-m32']
ar = 'gcc-ar'
strip = 'strip'

[properties]
needs_exe_wrapper = false

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
